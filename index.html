<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XTECH V9.3</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:'JetBrains Mono',monospace;background:#0d1117;color:#c9d1d9}
.layout{display:flex;min-height:100vh}.sidebar{width:240px;background:#161b22;border-right:1px solid #30363d;padding:16px}
.sidebar a{display:block;padding:10px;border-radius:6px;color:#c9d1d9;text-decoration:none;margin-bottom:4px;cursor:pointer}
.sidebar a.active{background:#1f6feb;color:white}.main{flex:1;padding:20px}
.btn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-weight:bold;background:#1f6feb;color:white}
#galeri{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.galeri-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:8px}
.galeri-card img,.galeri-card video{width:100%}.hidden{display:none}
.login-box{position:fixed;inset:0;background:#0d1117;display:flex;justify-content:center;align-items:center}
.login-card{background:#161b22;padding:24px;border-radius:8px;width:300px;text-align:center}
.chat-messages{height:400px;overflow-y:auto;background:#161b22;padding:10px;border-radius:8px}
.msg-bubble{padding:8px;background:#21262d;border-radius:6px;margin-bottom:5px}
</style>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>

<div id="login-box" class="login-box">
  <div class="login-card">
    <h2 style="color:#58a6ff">XTECH PANEL</h2>
    <input type="text" id="username" placeholder="Username">
    <button class="btn" onclick="login('admin')">LOGIN ADMIN</button>
    <button class="btn" style="background:#238636" onclick="login('member')">LOGIN MEMBER</button>
    <div id="form-login" class="hidden"><input type="password" id="pass" placeholder="Sandi Admin"><button class="btn" onclick="masuk()">MASUK</button></div>
  </div>
</div>

<div class="layout hidden" id="main-layout">
  <div class="sidebar">
    <h2 id="user-display"></h2>
    <a class="active" onclick="tab('dashboard')">Dashboard</a>
    <a onclick="tab('chat')">Chat</a>
    <a id="menu-admin" class="hidden" onclick="tab('setuju')">Kotak Persetujuan</a>
    <a onclick="logout()">Logout</a>
  </div>
  <div class="main">
    <div id="tab-dashboard">
      <h1>Dashboard</h1>
      <label class="btn">+ UPLOAD<input type="file" id="upload" class="hidden" accept="image/*,video/*"></label>
      <div id="galeri"></div>
    </div>
    <div id="tab-chat" class="hidden">
      <h1>Chat Global</h1>
      <div class="chat-messages" id="chat-box"></div>
      <input type="text" id="chat-input" placeholder="Ketik..."><button class="btn" onclick="kirim()">KIRIM</button>
    </div>
    <div id="tab-setuju" class="hidden">
      <h1>Kotak Persetujuan</h1>
      <div id="list-setuju"></div>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBfTs_JYl_UAGKWxsGOr0etuPeU49gs-xw",
  authDomain: "xtech-clan5.firebaseapp.com",
  databaseURL: "https://xtech-clan5-default-rtdb.firebaseio.com", // PENTING: tambahin ini
  projectId: "xtech-clan5",
  storageBucket: "xtech-clan5.firebasestorage.app",
  messagingSenderId: "930847391651",
  appId: "1:930847391651:web:dfa333095913786ed6a416"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database(); const storage = firebase.storage();

let role='', user='';
function login(t){ if(t==='member'){role='member';user=document.getElementById('username').value;masuk()}else{document.getElementById('form-login').classList.remove('hidden')}}
function masuk(){ if(role!=='admin'){const p=document.getElementById('pass').value; if(p!=='P1lotDuniaNol!')return alert('salah')} role='admin'; user=document.getElementById('username').value;
document.getElementById('login-box').classList.add('hidden'); document.getElementById('main-layout').classList.remove('hidden');
document.getElementById('user-display').innerText='Hai '+user; if(role==='admin')document.getElementById('menu-admin').classList.remove('hidden'); load();}

function tab(n){ ['dashboard','chat','setuju'].forEach(t=>document.getElementById('tab-'+t).classList.add('hidden')); document.getElementById('tab-'+n).classList.remove('hidden');}
function logout(){location.reload()}

document.getElementById('upload').onchange=async(e)=>{
  const f=e.target.files[0]; if(!f)return;
  const url=await (await storage.ref('up/'+Date.now()).put(f)).ref.getDownloadURL();
  db.ref('laporan').push({url,type:f.type.startsWith('image')?'foto':'video',status:'pending',by:user,waktu:Date.now()})
}

function kirim(){const t=document.getElementById('chat-input').value; if(!t)return; db.ref('chat').push({by:user,teks:t,waktu:Date.now()}); document.getElementById('chat-input').value=''}

function load(){
  // LOAD LAPORAN
  db.ref('laporan').on('value',s=>{
    const galeri=document.getElementById('galeri'); const setuju=document.getElementById('list-setuju');
    galeri.innerHTML=''; setuju.innerHTML='';
    s.forEach(ch=>{const d=ch.val(); d.id=ch.key;
      if(d.status==='approved'){
        galeri.innerHTML+=`<div class="galeri-card"><small>By:${d.by}</small><br>${d.type==='foto'?`<img src="${d.url}">`:`<video src="${d.url}" controls></video>`}</div>`
      }
      if(role==='admin' && d.status==='pending'){
        setuju.innerHTML+=`<div class="galeri-card"><small>By:${d.by}</small><br>${d.type==='foto'?`<img src="${d.url}">`:`<video src="${d.url}" controls></video>`}<br>
        <button class="btn" onclick="app('${d.id}')">SETUJUI</button></div>`
      }
    })
  })
  // LOAD CHAT
  db.ref('chat').on('value',s=>{
    const box=document.getElementById('chat-box'); box.innerHTML='';
    s.forEach(ch=>{const d=ch.val(); box.innerHTML+=`<div class="msg-bubble"><b>${d.by}:</b> ${d.teks}</div>`})
    box.scrollTop=box.scrollHeight;
  })
}
function app(id){db.ref('laporan/'+id).update({status:'approved'})}
</script>
</body>
  </html>
